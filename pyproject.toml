[project]
name = "edrvis"
version = "0.1.0"
description = "Visualise GROMACS edr files in the terminal."
readme = "README.md"
authors = [
    { name = "jamesmeadows7", email = "james.w.meadows@durham.ac.uk" }
]
keywords = ["gromacs", "molecular-dynamics", "tui", "visualisation"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.4",
    "plotext>=5.3.2",
    "pyedr>=0.8.0",
    "textual>=8.2.4",
]

[project.scripts]
edrvis = "edrvis.cli:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.33",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["edrvis"]
