[project]
name = "edrvis"
version = "0.3.0"
description = "Visualise GROMACS edr files in the terminal."
readme = "README.md"
authors = [
    { name = "jamesmeadows7", email = "james.w.meadows@durham.ac.uk" }
]
keywords = ["gromacs", "molecular-dynamics", "tui", "visualisation"]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.4.4",
    "pyedr>=0.8.0",
    "textual>=8.2.4",
    "textual-plotext>=1.0.1",
]

[project.urls]
Repository = "https://github.com/jamesmeadows7/edrvis"

[project.scripts]
edrvis = "edrvis.cli:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.33",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["edrvis"]
